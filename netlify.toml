[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

# ---------------------------------------------------------------
# Projetos de clientes.
# Padrão novo: cada cliente no próprio subdomínio (ex.: derrete.fsdev.site), para o SEO do
# cliente não se misturar com o do portfólio. O endereço antigo em pasta redireciona (301).
# Os que ainda estão em pasta usam proxy (status 200) e devem migrar do mesmo jeito.
# ---------------------------------------------------------------

# Derrete Escócia (repo derrete-escocia-site, base "/", https://derrete.fsdev.site)
[[redirects]]
  from = "/derrete"
  to = "https://derrete.fsdev.site/"
  status = 301
  force = true

[[redirects]]
  from = "/derrete/*"
  to = "https://derrete.fsdev.site/:splat"
  status = 301
  force = true

# Adelmo Júnior Advocacia (repo adelmo-advocacia-site, base "/adelmo/")
[[redirects]]
  from = "/adelmo"
  to = "https://adelmo-advocacia.netlify.app/adelmo/"
  status = 200
  force = true

[[redirects]]
  from = "/adelmo/*"
  to = "https://adelmo-advocacia.netlify.app/adelmo/:splat"
  status = 200
  force = true

# Dr. Fernando Fernandes (repo fernando-fernandes-site, base "/fernandofernandes/")
[[redirects]]
  from = "/fernandofernandes"
  to = "https://fernando-fernandes.netlify.app/fernandofernandes/"
  status = 200
  force = true

[[redirects]]
  from = "/fernandofernandes/*"
  to = "https://fernando-fernandes.netlify.app/fernandofernandes/:splat"
  status = 200
  force = true

# Jason: site de vendas do cortador de lives de GTA 6 (repo jason-site, basePath "/gta6")
[[redirects]]
  from = "/gta6"
  to = "https://jason-gta6.netlify.app/gta6/"
  status = 200
  force = true

[[redirects]]
  from = "/gta6/*"
  to = "https://jason-gta6.netlify.app/gta6/:splat"
  status = 200
  force = true
